<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nothing Pumpkin Competition</title>
<meta name="description" content="Pick your top 3 pumpkins. Voting closes 23:59, Thursday 5 November.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="Nothing Pumpkin Competition">
<meta property="og:description" content="21 pumpkins. Pick your top 3. Closes Thursday 5 November, 23:59.">
<meta property="og:image" content="https://fraser-nothing.github.io/pumpkin-vote/photos/pumpkin-03.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎃</text></svg>">
<link rel="preconnect" href="https://script.google.com">
<style>
html,body{margin:0;height:100%;background:#000;color:#f2f2f2;font:15px system-ui,-apple-system,sans-serif}
body{display:grid;place-items:center;text-align:center;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px);background-size:22px 22px;
  -webkit-mask-image:radial-gradient(circle at 50% 45%,#000,transparent 70%);mask-image:radial-gradient(circle at 50% 45%,#000,transparent 70%)}
svg{width:min(460px,84vw);height:auto;overflow:visible}
circle{fill:#ff6a00;opacity:.12;transition:opacity .25s}
circle.on{opacity:1;filter:drop-shadow(0 0 4px rgba(255,106,0,.7))}
p{margin:18px 0 0;color:#8c8c8c;letter-spacing:.04em}
.bar{width:140px;height:2px;margin:18px auto 0;background:#222;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:40%;background:#ff6a00;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
a{color:#ff6a00;opacity:0;transition:opacity .4s}
a.show{opacity:1}
@media (prefers-reduced-motion:reduce){.bar i{animation:none}}
</style>
</head>
<body>
<main>
  <svg id="logo" role="img" aria-label="Nothing"></svg>
  <p>Opening the pumpkin patch</p>
  <div class="bar"><i></i></div>
  <p><a id="go" href="https://script.google.com/a/macros/nothing.tech/s/AKfycbw71Mu5aVCPY4KQAGpdu7xzOd05xfBEwKDDAAMEmocSQWGdkQ2bhLP-F7jIJFfotqG7VA/exec">Taking a while? Tap here</a></p>
</main>
<script>
  const URL_ = document.getElementById('go').href;
  location.replace(URL_);
  setTimeout(() => document.getElementById('go').classList.add('show'), 4000);
  // Same dot-matrix logo as the voting page, so the hand-off feels like one load.
  const LOGO = [
    [0,4,7,8,9,12,13,14,15,16,18,22,24,25,26,28,32,35,36,37,38],
    [0,1,4,6,10,14,18,22,25,28,29,32,34],
    [0,2,4,6,10,14,18,19,20,21,22,25,28,30,32,34,36,37,38],
    [0,3,4,6,10,14,18,22,25,28,31,32,34,38],
    [0,4,7,8,9,14,18,22,24,25,26,28,32,35,36,37]
  ];
  const svg = document.getElementById('logo'), S = 10, R = 15, D = 5.1; // column pitch, row pitch, dot radius
  svg.setAttribute('viewBox', `0 0 ${39 * S} ${4 * R + 2 * D}`);
  LOGO.forEach((row, y) => row.forEach(x => {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', x * S + S / 2); c.setAttribute('cy', y * R + D); c.setAttribute('r', D);
    svg.appendChild(c);
    setTimeout(() => c.classList.add('on'), 60 + x * 22);
  }));
</script>
</body>
</html>
